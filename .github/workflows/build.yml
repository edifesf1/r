name: Build Edifesf APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Permissão Gradle
        run: chmod +x Edifesf/gradlew
      - name: Compilar
        run: ./gradlew assembleDebug
        working-directory: ./Edifesf
      - name: Baixar APK
        uses: actions/upload-artifact@v4
        with:
          name: Edifesf
          path: Edifesf/app/build/outputs/apk/debug/app-debug.apk
