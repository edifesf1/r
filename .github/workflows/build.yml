name: Build Edifesf APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew
        working-directory: ./Edifesf

      - name: Compilar APK
        run: ./gradlew assembleDebug
        working-directory: ./Edifesf

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Edifesf
          path: Edifesf/app/build/outputs/apk/debug/app-debug.apk
