name: Compilar PlayerEdifesf APK

on: workflow_dispatch: push: paths: - 'PlayerEdifesf/**' - '.github/workflows/build.yml'

jobs: build: runs-on: ubuntu-latest

defaults:
  run:
    working-directory: PlayerEdifesf

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Baixar codigo
    uses: actions/checkout@v4

  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Configurar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Verificar Android SDK
    run: |
      echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

  - name: Aceitar licencas Android
    run: |
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

  - name: Instalar SDK Android
    run: |
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Compilar APK
    run: gradle assembleDebug

  - name: Disponibilizar APK
    uses: actions/upload-artifact@v4
    with:
      name: PlayerEdifesf-APK
      path: PlayerEdifesf/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
