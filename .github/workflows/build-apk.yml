name: Build Edifesf APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Edifesf
        working-directory: YoutubeIPTVAndroid
        run: gradle assembleDebug

      - name: Disponibilizar Edifesf.apk para download
        uses: actions/upload-artifact@v4
        with:
          name: Edifesf-APK
          path: YoutubeIPTVAndroid/app/build/outputs/apk/debug/Edifesf.apk
          if-no-files-found: error
