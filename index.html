<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youtube IPTV</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column}
header{
  position:relative;z-index:100;flex:0 0 auto;width:100%;
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  min-height:58px;background:#c00;
}
#cascadeBar{display:flex;align-items:center;gap:7px;flex:1 1 auto;min-width:0;overflow-x:auto;background:transparent}
.cascade-group{display:flex;flex:1 1 0;min-width:0}
.cascade-group label{display:none}
.cascade-group select{
  width:100%;min-width:0;max-width:240px;padding:9px 22px 9px 8px;
  border:1px solid rgba(255,255,255,.5);border-radius:5px;
  background:#a90000;color:#fff;font-size:14px;outline:none
}
.cascade-group select:focus{border-color:#fff}
.cascade-group[hidden]{display:none}
#navegacaoCanais{display:flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto}
#navegacaoCanais button{
  display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  padding:0;border:1px solid rgba(255,255,255,.65);border-radius:6px;
  background:#990000;color:#fff;font-size:22px;font-weight:bold;cursor:pointer
}
#navegacaoCanais button:disabled{opacity:.45;cursor:not-allowed}
#botaoTarja{
  display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 auto;width:30px;height:30px;padding:0;
  border:1px solid rgba(255,255,255,.7);border-radius:5px;
  background:#790000;color:#fff;font-size:18px;font-weight:bold;line-height:1;cursor:pointer
}
#temaAtual{display:none}
main{position:relative;flex:1 1 auto;min-width:0;min-height:0;width:100%;overflow:hidden;background:#000}
#player{position:absolute;inset:0;width:100%;height:100%;background:#000;overflow:hidden}
#player iframe,#player video,#player>div,#player>div iframe{display:block;width:100%!important;height:100%!important;border:0}
#status,#lista{display:none!important}

/* ===== MODO MOUSE — SEM TEXTO NA TELA ===== */
#camadaMouse{
  position:fixed;inset:0;z-index:99999;display:none;background:transparent;
  pointer-events:none
}
body.modo-mouse #camadaMouse{display:block}

#ponteiro{
  position:absolute;top:50%;left:50%;width:28px;height:28px;
  margin:-14px 0 0 -14px;pointer-events:none;z-index:100000;
  background:#fff;border:3px solid #c00;border-radius:50%;
  box-shadow:0 0 12px rgba(255,255,255,.85);
  transition:none
}

/* Tarja recolhida */
body.tarja-recolhida>header{
  position:fixed;top:0;left:0;right:0;height:0;min-height:0;padding:0;
  background:transparent;pointer-events:none;z-index:200
}
body.tarja-recolhida>header>#cascadeBar,
body.tarja-recolhida>header>#navegacaoCanais{display:none}
body.tarja-recolhida>header>#botaoTarja{
  position:fixed;top:8px;right:8px;pointer-events:auto;
  width:30px;height:30px;background:rgba(120,0,0,.78);
  border-color:rgba(255,255,255,.55);opacity:.78
}
body.tarja-recolhida>main{
  position:fixed;inset:0;width:100%;height:100%;min-height:0;
  flex:none
}
body.tarja-recolhida #player{position:absolute;inset:0;width:100%;height:100%}
body.tarja-recolhida>header>#botaoTarja:hover,
body.tarja-recolhida>header>#botaoTarja:focus{opacity:1}

body.bloqueado{overflow:hidden}
body.bloqueado>header,body.bloqueado>main{visibility:hidden}
#telaLogin{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#3a1010,#090909 65%)}
#caixaLogin{width:min(420px,100%);padding:30px;border-radius:16px;background:#1b1b1b;border:1px solid #454545;box-shadow:0 18px 60px rgba(0,0,0,.55);text-align:center}
#caixaLogin h1{margin:0 0 8px;font-size:26px}
#caixaLogin p{color:#bbb;line-height:1.5}
#campoLogin{width:100%;padding:14px;margin:12px 0;border-radius:8px;border:1px solid #555;background:#101010;color:#fff;font-size:18px;text-align:center;text-transform:uppercase}
#entrarLogin{width:100%;padding:14px;border:0;border-radius:8px;background:#c00;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
#entrarLogin:disabled{opacity:.55}
#erroLogin{min-height:22px;color:#ff7777;font-size:14px}
@media(max-width:600px){
  header{gap:5px;padding:7px 6px;min-height:52px}
  #cascadeBar{gap:4px}
  .cascade-group select{max-width:none;font-size:11px;padding:8px 15px 8px 4px}
  #navegacaoCanais{gap:3px}
  #navegacaoCanais button{width:30px;height:32px;font-size:18px}
  #botaoTarja{width:27px;height:27px;font-size:16px}
}
@media(max-width:360px){
  header{gap:3px;padding:5px 4px}
  .cascade-group select{font-size:10px;padding-left:3px}
  #navegacaoCanais button{width:27px}
  #botaoTarja{width:25px;height:25px;font-size:15px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>
</head>
<body class="bloqueado">

<!-- ===== CAMADA DO MOUSE — SEM TEXTO ===== -->
<div id="camadaMouse">
  <div id="ponteiro"></div>
</div>

<section id="telaLogin" aria-label="Tela de login">
  <form id="caixaLogin">
    <h1>Youtube IPTV</h1>
    <p>Digite seu login de acesso para continuar.<br>Não é necessária senha.</p>
    <input id="campoLogin" name="login" autocomplete="off" autocapitalize="characters"
      placeholder="Ex.: A7B29X" maxlength="6" minlength="6"
      pattern="[A-Za-z0-9]{6}" required>
    <button id="entrarLogin" type="submit">ENTRAR</button>
    <div id="erroLogin" role="alert"></div>
  </form>
</section>
<header aria-label="Controles do player">
  <nav id="cascadeBar" aria-label="Filtros">
    <div class="cascade-group" id="grupoA1"><label for="menuA1">Tema</label><select id="menuA1" title="Tema" aria-label="Tema"><option value=""></option></select></div>
    <div class="cascade-group" id="grupoB2" hidden>
  <label for="menuB2">Categoria ou pesquisa</label>
  <select id="menuB2" title="Categoria" aria-label="Categoria">
    <option value=""></option>
  </select>
  <input id="campoPesquisa" type="search"
    placeholder="Pesquisar conteúdo..."
    aria-label="Pesquisar canais, filmes, séries e músicas"
    style="display:none;width:100%;min-width:100px;padding:9px 8px;border-radius:5px;border:1px solid white;background:#a90000;color:white;font-size:14px">
</div>
<div class="cascade-group" id="grupoC3" hidden>
  <label for="menuC3">Resultados</label>
  <select id="menuC3" title="Resultados" aria-label="Resultados">
    <option value=""></option>
  </select>
</div>
    <div class="cascade-group" id="grupoD4" hidden><label for="menuD4">Episódio</label><select id="menuD4" title="Episódio" aria-label="Episódio"><option value=""></option></select></div>
  </nav>
  <div id="navegacaoCanais" aria-label="Navegação entre canais">
    <button id="canalAnterior" type="button" title="Canal anterior" aria-label="Canal anterior">◀</button>
    <button id="proximoCanal" type="button" title="Próximo canal" aria-label="Próximo canal">▶</button>
  </div>
  <button id="botaoTarja" type="button" title="Recolher tarja" aria-label="Recolher tarja" aria-pressed="false">▁</button>
</header>
<main>
  <div id="player"></div>
  <div id="status"></div>
  <div id="lista"></div>
</main>

<script>
// =====================================================
// 🖱️ MODO MOUSE — PERCORRE TELA INTEIRA, SEM TEXTO
// =====================================================
const camadaMouse = document.getElementById('camadaMouse');
const ponteiro = document.getElementById('ponteiro');
const ALTURA_TARJA = 58; // Altura da tarja no topo
const VELOCIDADE = 14; // Ajuste: maior = mais rápido

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let modoMouseLigado = false;

function atualizarPonteiro(){
  ponteiro.style.left = mouseX + 'px';
  ponteiro.style.top = mouseY + 'px';
}

function ligarMouse(){
  if(modoMouseLigado) return;
  modoMouseLigado = true;
  document.body.classList.add('modo-mouse');
  mouseX = window.innerWidth / 2;
  mouseY = window.innerHeight / 2;
  atualizarPonteiro();
}

function desligarMouse(){
  if(!modoMouseLigado) return;
  modoMouseLigado = false;
  document.body.classList.remove('modo-mouse');
}

function clicarAqui(){
  const el = document.elementFromPoint(mouseX, mouseY);
  if(el && el.id !== 'camadaMouse' && el.id !== 'ponteiro'){
    el.click();
  }
}

// TECLADO
document.addEventListener('keydown', function(e){
  if(modoMouseLigado){
    e.preventDefault();
    switch(e.key){
      case 'ArrowLeft':
        mouseX = Math.max(14, mouseX - VELOCIDADE);
        break;
      case 'ArrowRight':
        mouseX = Math.min(window.innerWidth - 14, mouseX + VELOCIDADE);
        break;
      case 'ArrowDown':
        mouseY = Math.min(window.innerHeight - 14, mouseY + VELOCIDADE);
        break;
      case 'ArrowUp':
        // ✅ SÓ desliga o mouse quando CHEGAR BEM NO TOPO da tarja
        if(mouseY <= ALTURA_TARJA + 14){
          desligarMouse();
          return;
        }
        mouseY = Math.max(ALTURA_TARJA + 14, mouseY - VELOCIDADE);
        break;
      case 'Enter':
      case 'OK':
        clicarAqui();
        break;
    }
    atualizarPonteiro();
  }else{
    // Fora do mouse: seta para baixo LIGA
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      ligarMouse();
    }
  }
});

// =====================================================
// RESTO DO SISTEMA
// =====================================================
const tarja = document.querySelector("header");
const navegacaoCanais = document.getElementById("navegacaoCanais");
const telaLogin = document.getElementById("telaLogin");
const campoLogin = document.getElementById("campoLogin");
const erroLogin = document.getElementById("erroLogin");
const botaoEntrar = document.getElementById("entrarLogin");
const status = document.getElementById("status");
const lista = document.getElementById("lista");
const menuA1 = document.getElementById("menuA1");
const menuB2 = document.getElementById("menuB2");
const menuC3 = document.getElementById("menuC3");
const menuD4 = document.getElementById("menuD4");
const campoPesquisa = document.getElementById("campoPesquisa");
let modoPesquisa = false;
const grupos = {
  A1:document.getElementById("grupoA1"),
  B2:document.getElementById("grupoB2"),
  C3:document.getElementById("grupoC3"),
  D4:document.getElementById("grupoD4")
};
const botaoCanalAnterior = document.getElementById("canalAnterior");
const botaoProximoCanal = document.getElementById("proximoCanal");
const botaoTarja = document.getElementById("botaoTarja");

function alternarTarja(){
  const recolhida = document.body.classList.toggle("tarja-recolhida");
  botaoTarja.textContent = recolhida ? "☰" : "▁";
  botaoTarja.title = recolhida ? "Mostrar tarja" : "Recolher tarja";
  botaoTarja.setAttribute("aria-label", botaoTarja.title);
  botaoTarja.setAttribute("aria-pressed", String(recolhida));
}
botaoTarja.addEventListener("click", alternarTarja);

const URL_SESSOES = "https://script.google.com/macros/s/AKfycbyjEMCft9Z-84Owpfukv4ROvVv3w2Ax4QsyPvULPuk424Ej8Liz8AU5xmQnoLSDMl2b/exec";
const DEVICE_KEY = "edifesfDeviceId";
let heartbeatTimer = null;
let LOGINS_VALIDOS = [];
let todosVideos = [];
let videos = [];
let player = null;
let hlsInstance = null;
let ytPlayerApi = null;
let geracaoPlayer = 0;
let ytApiPromise = null;
let selecionado = 0;

function registrarFalha(item,tipo,erro,codigo=""){
  console.warn("Falha de reprodução:", {canal:item?.titulo||"Canal sem nome", tipo, url:item?.url||"", erro:String(erro||"Falha de reprodução"), codigo:String(codigo||"")});
}

function carregarYouTubeAPI(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  if(ytApiPromise)return ytApiPromise;
  ytApiPromise=new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>reject(new Error("Tempo esgotado ao carregar a API do YouTube")),15000);
    const callbackAnterior=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{
      clearTimeout(timeout);
      if(typeof callbackAnterior==="function")callbackAnterior();
      resolve();
    };
    let script=document.querySelector('script[src="https://www.youtube.com/iframe_api"]');
    if(!script){
      script=document.createElement("script");
      script.src="https://www.youtube.com/iframe_api";
      script.onerror=()=>{clearTimeout(timeout);reject(new Error("Falha ao carregar a API do YouTube"));};
      document.head.appendChild(script);
    }
  });
  return ytApiPromise;
}

function ativarTelaCheia(){
  try{
    if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  }catch(e){}
}

function obterDeviceId(){
  let id=localStorage.getItem(DEVICE_KEY);
  if(!id){id="dev_"+Array.from(crypto.getRandomValues(new Uint8Array(18))).map(n=>n.toString(16).padStart(2,"0")).join("");localStorage.setItem(DEVICE_KEY,id);}
  return id;
}

function chamarControleSessao(action,login){
  return new Promise((resolve,reject)=>{
    if(!URL_SESSOES || URL_SESSOES.includes("COLE_AQUI")){reject(new Error("Falta configurar URL"));return;}
    const callback="edifesfCb_"+Date.now()+"_"+Math.floor(Math.random()*1000000);
    const script=document.createElement("script");
    const timeout=setTimeout(()=>{limpar();reject(new Error("Sem resposta"));},12000);
    function limpar(){clearTimeout(timeout);delete window[callback];script.remove();}
    window[callback]=(data)=>{limpar();resolve(data);};
    script.onerror=()=>{limpar();reject(new Error("Falha de conexão"));};
    script.src=URL_SESSOES+"?"+new URLSearchParams({action,login,device:obterDeviceId(),callback});
    document.head.appendChild(script);
  });
}

function pararHeartbeat(){if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}}
function exibirLogin(mensagem){
  pararHeartbeat();document.body.classList.add("bloqueado");telaLogin.style.display="flex";
  erroLogin.textContent=mensagem||"Digite seu login de acesso para continuar.";
}
function iniciarHeartbeat(login){
  pararHeartbeat();
  heartbeatTimer=setInterval(async()=>{
    try{
      const resposta=await chamarControleSessao("heartbeat",login);
      if(!resposta.ok){localStorage.removeItem("youtubeIptvLogin");exibirLogin(resposta.message||"Sessão encerrada.");}
    }catch(e){}
  },30000);
}
async function liberarAcesso(login){
  botaoEntrar.disabled=true;erroLogin.textContent="Verificando...";
  try{
    const resposta=await chamarControleSessao("claim",login);
    if(!resposta.ok){localStorage.removeItem("youtubeIptvLogin");erroLogin.textContent=resposta.message||"Acesso negado.";return false;}
    document.body.classList.remove("bloqueado");telaLogin.style.display="none";
    localStorage.setItem("youtubeIptvLogin",login);ativarTelaCheia();iniciarHeartbeat(login);return true;
  }catch(e){
    erroLogin.textContent="Não foi possível verificar o login.";return false;
  }finally{botaoEntrar.disabled=false;}
}

document.addEventListener("click",ativarTelaCheia);
document.addEventListener("touchend",ativarTelaCheia,{passive:true});

async function carregarLogins(){
  botaoEntrar.disabled=true;erroLogin.textContent="Carregando...";
  try{
    const r=await fetch("./LOGINS-200.txt?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(""+r.status);
    LOGINS_VALIDOS=[...new Set((await r.text()).split(/\r?\n/).map(l=>l.trim().toUpperCase()).filter(l=>/^[A-Z0-9]{6}$/.test(l)))];
    const salvo=localStorage.getItem("youtubeIptvLogin");
    if(salvo&&LOGINS_VALIDOS.includes(salvo))await liberarAcesso(salvo);
    else telaLogin.style.display="flex";
  }catch(e){erroLogin.textContent="Não foi possível carregar os logins.";}
  finally{botaoEntrar.disabled=false;}
}

document.getElementById("caixaLogin").addEventListener("submit",async e=>{
  e.preventDefault();
  const l=campoLogin.value.trim().toUpperCase();
  if(!LOGINS_VALIDOS.includes(l)){erroLogin.textContent="Login inválido.";campoLogin.select();return;}
  await liberarAcesso(l);
});

window.addEventListener("beforeunload",()=>{
  const login=localStorage.getItem("youtubeIptvLogin");
  if(login && URL_SESSOES && !URL_SESSOES.includes("COLE_AQUI")){
    const img=new Image();
    img.src=URL_SESSOES+"?action=release&login="+encodeURIComponent(login)+"&device="+encodeURIComponent(obterDeviceId())+"&_="+Date.now();
  }
});

function atualizarBotoesNavegacao(){botaoCanalAnterior.disabled=botaoProximoCanal.disabled=videos.length<=1;}
function navegarCanal(direcao){
  if(!videos.length)return;
  selecionado=(selecionado+direcao+videos.length)%videos.length;
  const item=videos[selecionado];
  if(menuD4.value)menuD4.value=item.titulo;
  criarPlayer();
}
botaoCanalAnterior.addEventListener("click",()=>navegarCanal(-1));
botaoProximoCanal.addEventListener("click",()=>navegarCanal(1));

function preencherSelect(select,valores){
  select.innerHTML='<option value=""></option>'+[...new Set(valores.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR")).map(v=>`<option>${v}</option>`).join('');
}
function mostrarGrupo(nome,mostrar){grupos[nome].hidden=!mostrar;}
function limparAbaixo(nivel){
  if(nivel<=1){menuB2.value="";mostrarGrupo("B2",false);}
  if(nivel<=2){menuC3.value="";mostrarGrupo("C3",false);}
  if(nivel<=3){menuD4.value="";mostrarGrupo("D4",false);}
}
function aplicarFiltros(){
  const tema=menuA1.value,categoria=menuB2.value,classificacao=menuC3.value,episodio=menuD4.value;
  videos=todosVideos.filter(v=>(!tema||v.tema===tema)&&(!categoria||v.categoria===categoria)&&(!classificacao||v.classificacao===classificacao));
  if(!videos.length){atualizarBotoesNavegacao();return;}
  selecionado=episodio?videos.findIndex(v=>v.titulo===episodio):0;
  if(selecionado<0)selecionado=0;
  atualizarBotoesNavegacao();
  if(episodio||!player)criarPlayer();
}

menuA1.addEventListener("change",()=>{
  limparAbaixo(1);const tema=menuA1.value;
  if(tema==="Pesquisa"){
    ativarPesquisa(true);return;
  }
  ativarPesquisa(false);
  if(tema){preencherSelect(menuB2,todosVideos.filter(v=>v.tema===tema).map(v=>v.categoria));mostrarGrupo("B2",true);}
  aplicarFiltros();
});
menuB2.addEventListener("change",()=>{
  limparAbaixo(2);
  if(menuA1.value&&menuB2.value){preencherSelect(menuC3,todosVideos.filter(v=>v.tema===menuA1.value&&v.categoria===menuB2.value).map(v=>v.classificacao));mostrarGrupo("C3",true);}
  aplicarFiltros();
});
menuC3.addEventListener("change",()=>{
  if(modoPesquisa){
    const idx=Number(menuC3.value);
    if(Number.isInteger(idx)&&idx>=0&&idx<videos.length){selecionado=idx;criarPlayer();}
    return;
  }
  limparAbaixo(3);
  if(menuA1.value&&menuB2.value&&menuC3.value){
    preencherSelect(menuD4,todosVideos.filter(v=>v.tema===menuA1.value&&v.categoria===menuB2.value&&v.classificacao===menuC3.value).map(v=>v.titulo));
    mostrarGrupo("D4",true);
  }
  aplicarFiltros();
});
menuD4.addEventListener("change",aplicarFiltros);

function limparPlayerPesquisa(){
  geracaoPlayer++;
  if(hlsInstance){try{hlsInstance.destroy();}catch(e){}}
  if(ytPlayerApi){try{ytPlayerApi.destroy();}catch(e){}}
  document.getElementById("player").innerHTML='';player=null;
}
function ativarPesquisa(ativar){
  modoPesquisa=ativar;
  campoPesquisa.style.display=ativar?'block':'none';
  menuB2.style.display=ativar?'none':'';
  mostrarGrupo("B2",ativar);mostrarGrupo("C3",ativar);mostrarGrupo("D4",false);
  if(ativar){limparPlayerPesquisa();videos=[];selecionado=0;campoPesquisa.focus();}
  else{campoPesquisa.value='';}
}
function pesquisarConteudo(){
  if(!modoPesquisa)return;
  const t=campoPesquisa.value.trim().toLocaleLowerCase("pt-BR");
  videos=t?todosVideos.filter(v=>(v.classificacao+v.titulo).toLocaleLowerCase("pt-BR").includes(t)):[];
  selecionado=0;
  preencherSelect(menuC3,videos.map(v=>[v.classificacao,v.titulo].filter(Boolean).join(" - ")));
  if(videos.length)criarPlayer();
}
campoPesquisa.addEventListener("input",pesquisarConteudo);

function extrairId(valor){
  try{
    const u=new URL(valor);
    if(u.hostname==="youtu.be")return u.pathname.slice(1).split('/')[0];
    if(["youtube.com","www.youtube.com","m.youtube.com","youtube-nocookie.com","www.youtube-nocookie.com"].includes(u.hostname)){
      if(u.pathname==="/watch")return u.searchParams.get("v");
      const p=u.pathname.split('/').filter(Boolean);
      if(["embed","shorts","live","v"].includes(p[0]))return p[1];
    }
  }catch{}
  return null;
}

function criarPlayer(){
  if(!videos.length)return;
  const item=videos[selecionado];
  const area=document.getElementById("player");
  geracaoPlayer++;
  if(ytPlayerApi){try{ytPlayerApi.destroy();}catch(e){}}
  if(hlsInstance){try{hlsInstance.destroy();}catch(e){}}
  area.innerHTML='';player=null;

  if(item.url.match(/\.m3u8(?:$|[?#])/i)){
    const v=document.createElement('video');
    v.controls=v.autoplay=v.playsInline=true;
    v.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';
    area.appendChild(v);
    if(window.Hls&&Hls.isSupported()){
      hlsInstance=new Hls({enableWorker:true,manifestLoadingTimeOut:20000,fragLoadingTimeOut:30000});
      hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
      hlsInstance.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)registrarFalha(item,"HLS",d.details,"");});
      hlsInstance.loadSource(item.url);hlsInstance.attachMedia(v);
    }else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=item.url;v.play().catch(()=>{});}
    return;
  }

  const c=document.createElement('div');c.id='yt'+geracaoPlayer;
  area.appendChild(c);
  carregarYouTubeAPI().then(()=>{
    ytPlayerApi=new YT.Player(c.id,{
      width:'100%',height:'100%',videoId:item.id,
      playerVars:{autoplay:1,playsinline:1,rel:0,enablejsapi:1,origin:location.origin},
      events:{
        onReady:e=>e.target.playVideo(),
        onError:e=>registrarFalha(item,"YouTube","Erro de reprodução",String(e.data))
      }
    });
    player=ytPlayerApi;
  }).catch(e=>registrarFalha(item,"YouTube",e.message||"Falha na API","API"));
}

async function carregarLista(){
  try{
    const r=await fetch("./youtube.txt?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const t=await r.text();
    todosVideos=t.split(/\r?\n/).map(l=>l.trim()).filter(l&&!l.startsWith('#')).map(l=>{
      const p=l.split('|').map(x=>x.trim());
      let tema='Geral',categoria='Filmes',classificacao='Geral',titulo,url;
      if(p.length>=5)[tema,categoria,classificacao,titulo,url]=p;
      else if(p.length>=3)[tema,titulo,url]=p;
      else if(p.length===2)[titulo,url]=p;
      else return null;
      const id=extrairId(url);
      if(url.match(/\.m3u8(?:$|[?#])/i))return {tema,categoria,classificacao,titulo,url,tipo:'hls'};
      return id?{tema,categoria,classificacao,titulo,url,id,tipo:'youtube'}:null;
    }).filter(Boolean);
    const temas=['Pesquisa',...[...new Set(todosVideos.map(v=>v.tema).filter(Boolean))].filter(t=>t!=='Pesquisa').sort((a,b)=>a.localeCompare(b,"pt-BR"))];
    menuA1.innerHTML=temas.map(t=>`<option>${t}</option>`).join('');
    aplicarFiltros();
  }catch(e){console.error('Erro ao carregar lista:',e);}
}

carregarLogins();
carregarLista();
</script>
