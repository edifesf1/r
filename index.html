// Navegação entre a tarja vermelha e os players RDCanais/RedeCanais.
document.addEventListener("keydown", function(e){

  const iframe = document.querySelector("#player iframe");
  if(!iframe) return;

  let dominio = "";

  try {
    dominio = new URL(iframe.src).hostname.toLowerCase();
  } catch(err) {
    return;
  }

  const playerEspecial =
    dominio === "rdcanais.org" ||
    dominio.endsWith(".rdcanais.org") ||
    dominio === "redecanais.by" ||
    dominio.endsWith(".redecanais.by") ||
    dominio === "embedtv.cc" ||
    dominio.endsWith(".embedtv.cc");

  if(!playerEspecial) return;

  // Seta para baixo: força a entrada do foco no iframe do player.
  // Repete a tentativa por um curto período para TVs/Fire Stick,
  // nos quais o foco pode escapar durante a transição.
  if(
    e.key === "ArrowDown" &&
    (tarja.contains(document.activeElement) || document.activeElement === document.body)
  ){
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    iframe.setAttribute("tabindex", "0");

    const iframeAlvo = iframe;
    const inicioFoco = Date.now();

    function forcarFoco(){
      if(
        !iframeAlvo.isConnected ||
        document.querySelector("#player iframe") !== iframeAlvo ||
        Date.now() - inicioFoco > 1600

        clearInterval(repetirFoco);

        iframeAlvo.focus({preventScroll:true});

        try{ iframeAlvo.focus(); }catch(e2){}
      }
    }

    forcarFoco();
    const repetirFoco = setInterval(forcarFoco, 120);
  }

}, true);

function extrairHandleCanal(valor){
  try{
    const url = new URL(valor);
    if(!["youtube.com","www.youtube.com","m.youtube.com"].includes(url.hostname.toLowerCase())) return null;

    const match = url.pathname.match(/^\/@([^/]+)\/live\/?$/i);
    return match ? decodeURIComponent(match[1]) : null;
  }catch(e){
    return null;
  }
}

async function youtubeApi(endpoint, parametros){
  const url = new URL("https://www.googleapis.com/youtube/v3/" + endpoint);

  Object.entries({
    ...parametros,
    key: YOUTUBE_API_KEY
  }).forEach(([k,v]) => url.searchParams.set(k,v));

  const resposta = await fetch(url);
  const dados = await resposta.json();

  if(!resposta.ok){
    throw new Error(dados.error?.message || "Erro na consulta ao YouTube.");
  }

  return dados;
}

  async function resolverTransmissaoAoVivo(item){
  const handle = item.handle || extrairHandleCanal(item.url);

  if(!handle){
    throw new Error("Não foi possível identificar o canal.");
  }

  const canais = await youtubeApi("channels", {
    part: "id",
    forHandle: handle,
    maxResults: "1"
  });

  const canalId = canais.items?.[0]?.id;

  if(!canalId){
    throw new Error("Canal @" + handle + " não encontrado.");
  }

  // Primeiro procura uma transmissão ao vivo.
  const buscaLive = await youtubeApi("search", {
    part: "id",
    channelId: canalId,
    eventType: "live",
    type: "video",
    order: "date",
    maxResults: "1"
  });

  const videoLive = buscaLive.items?.[0]?.id?.videoId;

  if(videoLive){
    return videoLive;
  }

  // Se não houver live, procura a última transmissão encerrada.
  const buscaGravada = await youtubeApi("search", {
    part: "id",
    channelId: canalId,
    eventType: "completed",
    type: "video",
    order: "date",
    maxResults: "1"
  });

  const ultimaLive = buscaGravada.items?.[0]?.id?.videoId;

  if(ultimaLive){
    return ultimaLive;
  }

  throw new Error(
    "Nenhuma transmissão ao vivo ou gravação de live encontrada."
  );
}

function carregarYouTubeAPI(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  if(ytApiPromise)return ytApiPromise;
  ytApiPromise=new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>reject(new Error("Tempo esgotado ao carregar a API do YouTube")),15000);
    const callbackAnterior=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{
      clearTimeout(timeout);
      if(typeof callbackAnterior==="function")callbackAnterior();
      resolve();
    };
    let script=document.querySelector('script[src="https://www.youtube.com/iframe_api"]');
    if(!script){
      script=document.createElement("script");
      script.src="https://www.youtube.com/iframe_api";
      script.onerror=()=>{clearTimeout(timeout);reject(new Error("Falha ao carregar a API do YouTube"));};
      document.head.appendChild(script);
    }
  });
  return ytApiPromise;
}

function obterDeviceId(){

}
function chamarControleSessao(action,login){
  return new Promise((resolve,reject)=>{
    if(!URL_SESSOES || URL_SESSOES.includes("COLE_AQUI")){reject(new Error("Falta configurar a URL do Apps Script de sessões."));return;}
    const callback="edifesfCb_"+Date.now()+"_"+Math.floor(Math.random()*1000000);
    const script=document.createElement("script");
    const timeout=setTimeout(()=>{limpar();reject(new Error("O servidor de sessões não respondeu."));},12000);
    function limpar(){clearTimeout(timeout);delete window[callback];script.remove();}
    window[callback]=(data)=>{limpar();resolve(data);};
    script.onerror=()=>{limpar();reject(new Error("Não foi possível acessar o servidor de sessões."));};
    const params=new URLSearchParams({action,login,device:obterDeviceId(),callback,_:String(Date.now())});
    script.src=URL_SESSOES+"?"+params.toString();document.head.appendChild(script);
  });
}

  }finally{botaoEntrar.disabled=false;}
}

/*
 * Identifica transmissões ao vivo usando os campos do youtube.txt
 * e os formatos comuns de URL do YouTube.
 */
function ehTransmissaoAoVivo(item){
  if(!item)return false;

  const categoria=String(item.categoria||"").trim().toLowerCase();
  const classificacao=String(item.classificacao||"").trim().toLowerCase();
  const titulo=String(item.titulo||"").trim().toLowerCase();
  const url=String(item.url||"").trim().toLowerCase();

  if(["live","ao vivo"].includes(categoria))return true;
  if(["live","ao vivo"].includes(classificacao))return true;

  // URLs do YouTube com o caminho /live, como /@canal/live.
  if(/youtube\.com\/.*\/live(?:[/?#]|$)/i.test(url))return true;

  // Também reconhece URLs que contenham /live no caminho.
  try{
    const endereco=new URL(url);
    if(
      (endereco.hostname==="youtube.com"||
       endereco.hostname==="www.youtube.com"||
       endereco.hostname==="m.youtube.com") &&
      /\/live\/?$/i.test(endereco.pathname)
    )return true;
  }catch(e){}

  if(/\bao vivo\b/.test(titulo))return true;

  return false;
}

/*
 * Avança somente para outro vídeo gravado do YouTube.
 * Nunca muda automaticamente para rádio, M3U/M3U8 ou Live.
 */
function avancarParaProximoGravado(itemAtual,geracaoAtual){
  if(!itemAtual||itemAtual.tipo!=="youtube")return;
  if(ehTransmissaoAoVivo(itemAtual))return;

  // Ignora eventos atrasados de um player que já foi substituído.
  if(geracaoAtual!==geracaoPlayer)return;
  if(videos[selecionado]!==itemAtual)return;

  const total=videos.length;
  if(total<=1)return;

  for(let passo=1;passo<total;passo++){
    const indice=(selecionado+passo)%total;
    const candidato=videos[indice];

    if(
      candidato &&
      candidato.tipo==="youtube" &&
      !ehTransmissaoAoVivo(candidato)
    ){
      selecionado=indice;

      if(menuD4.value){
        menuD4.value=candidato.titulo;
      }

      [...lista.children].forEach((b,i)=>{
        b.classList.toggle("ativo",i===selecionado);
      });

      criarPlayer();
      return;
    }
  }

  // Nenhum outro vídeo gravado disponível: mantém o atual.
}

// Verifica se a URL original contém autoplay=1.
function temAutoplayLiberado(url){
  try{
    return new URL(url, location.href)
      .searchParams.get("autoplay") === "1";
  }catch(e){
    return /(?:[?&])autoplay=1(?:&|#|$)/i.test(String(url));
  }
}

// Função única para criar e controlar todos os players externos.
function criarIframeExterno(item, geracao, urlFinal, urlOriginal){

  const area = document.getElementById("player");
  const iframe = document.createElement("iframe");

  // EmbedTV recebe autoplay=1 na URL final e precisa manter
  // o iframe acessível ao controle remoto e ao clique.
  let liberarClique = temAutoplayLiberado(urlOriginal);
  try {
    const hostOriginal = new URL(urlOriginal, location.href).hostname.toLowerCase();
    if (hostOriginal === "embedtv.cc" || hostOriginal.endsWith(".embedtv.cc")) {
      liberarClique = true;
    }
  } catch(e) {}

  iframe.title = item.titulo || "Player externo";

  // No EmbedTV, restringe a abertura de novas abas/janelas.
  // Scripts, formulários e reprodução continuam permitidos.
  try {
    const hostIframe = new URL(urlFinal, location.href).hostname.toLowerCase();
    if (hostIframe === "embedtv.cc" || hostIframe.endsWith(".embedtv.cc")) {
      iframe.setAttribute(
        "sandbox",
        "allow-scripts allow-same-origin allow-forms allow-presentation allow-pointer-lock"
      );
    }
  } catch(e) {}

  iframe.src = urlFinal;
  iframe.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write";
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = "strict-origin-when-cross-origin";
  iframe.setAttribute("allowtransparency", "true");
  iframe.tabIndex = 0;

  // EmbedTV deve receber o foco assim que for identificado/criado.
  // A tentativa é repetida após a inserção e após o carregamento,
  // pois alguns aparelhos de TV demoram a ativar o iframe.
  const ehEmbedTV = (() => {
    try {
      const host = new URL(urlFinal, location.href).hostname.toLowerCase();
      return host === "embedtv.cc" || host.endsWith(".embedtv.cc");
    } catch(e) {
      return false;
    }
  })();

  if (ehEmbedTV) {
    iframe.setAttribute("autofocus", "autofocus");
    iframe.setAttribute("tabindex", "0");
  }

  iframe.style.cssText =
    "display:block;width:100%;height:100%;border:0;background:#000;";

  // Se não houver autoplay=1, cria a camada de bloqueio.
  if(!liberarClique){

    const moldura = document.createElement("div");

    moldura.style.cssText =
      "position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#000;";

    const bloqueio = document.createElement("div");

    bloqueio.setAttribute("aria-label","Controles internos bloqueados");
    bloqueio.setAttribute("role","presentation");

    bloqueio.style.cssText = [
      "position:absolute",
      "inset:0",
      "z-index:5",
      "background:transparent",
      "pointer-events:none",
      "outline:none",
      "cursor:default"
    ].join(";");

    let bloqueioAtivo = false;

    function iniciarContagem(){

      if(
        bloqueioAtivo ||
        temporizadorPlayerExterno !== null
      ) return;

      temporizadorPlayerExterno = setTimeout(()=>{

        temporizadorPlayerExterno = null;

        // Ignora temporizadores de players que já foram substituídos.
        if(
          geracao !== geracaoPlayer ||
          !area.contains(moldura)
        ) return;

        bloqueioAtivo = true;

        bloqueio.style.pointerEvents = "auto";

        try{
          iframe.blur();
        }catch(e){}

        status.textContent =
          "Player externo iniciado. Navegação interna bloqueada.";

        console.log(
          "Bloqueio do player externo ativado:",
          item.titulo
        );

      },2500);
    }

    // Inicia a contagem quando o iframe recebe foco ou clique.
    iframe.addEventListener("focus", iniciarContagem);
    iframe.addEventListener("pointerdown", iniciarContagem);

    moldura.appendChild(iframe);
    moldura.appendChild(bloqueio);

    area.appendChild(moldura);

  }else{

    // autoplay=1 mantém a interação liberada.
    area.appendChild(iframe);

    console.log(
      "Interação liberada para player externo:",
      item.titulo
    );
  }

  player = iframe;

  // Coloca o foco no próprio iframe do EmbedTV sem exigir que o usuário
  // pressione BAIXO + OK. Faz tentativas curtas para aguardar a TV/iframe.
  if (ehEmbedTV) {
    let tentativasFoco = 0;
    const focarEmbedTV = () => {
      if (
        !iframe.isConnected ||
        player !== iframe ||
        tentativasFoco >= 16
      ) {
        clearInterval(intervaloFocoEmbedTV);
        return;
      }

      tentativasFoco++;
      try {
        iframe.focus({ preventScroll: true });
      } catch(e) {
        try { iframe.focus(); } catch(e2) {}
      }
    };

    // A primeira tentativa acontece logo após inserir o iframe.
    focarEmbedTV();
    const intervaloFocoEmbedTV = setInterval(focarEmbedTV, 250);
  }

  status.textContent = "Carregando player externo: " + item.titulo;

  iframe.addEventListener("load",()=>{

    if(geracao !== geracaoPlayer) return;

    if (ehEmbedTV) {
      let tentativasAposLoad = 0;
      const intervaloAposLoad = setInterval(() => {
        if (
          !iframe.isConnected ||
          player !== iframe ||
          tentativasAposLoad >= 12
        ) {
          clearInterval(intervaloAposLoad);
          return;
        }

        tentativasAposLoad++;
        try {
          iframe.focus({ preventScroll: true });
        } catch(e) {
          try { iframe.focus(); } catch(e2) {}
        }
      }, 250);
    }

    status.textContent =
      "Player externo carregado: " + item.titulo;

  });

  iframe.addEventListener("error",()=>{

    if(geracao !== geracaoPlayer) return;

    status.textContent =
      "Não foi possível carregar o player externo.";

  });

}

function pesquisarConteudo() {
  if (!modoPesquisa) return;

  const termo = campoPesquisa.value.trim().toLocaleLowerCase("pt-BR");
  // A pesquisa considera somente os dois últimos campos: classificação (C3) e título (D4).
  const encontrados = termo
    ? todosVideos.filter(v =>
        [v.classificacao, v.titulo]
          .some(valor => String(valor || "").toLocaleLowerCase("pt-BR").includes(termo))
      )
    : [];

  // Ao mudar a busca, interrompe o conteúdo anterior para não deixar um vídeo antigo tocando.
  limparPlayerPesquisa();
  videos = encontrados;
  selecionado = 0;
  menuC3.replaceChildren();

  const inicial = document.createElement("option");
  inicial.value = "";
  inicial.textContent = termo
    ? (encontrados.length
        ? `${encontrados.length} resultado(s) encontrado(s)`
        : "Nenhum resultado encontrado")
    : "Digite para pesquisar";
  menuC3.appendChild(inicial);

  encontrados.forEach((video, indice) => {
    const opcao = document.createElement("option");
    opcao.value = String(indice);
    // Mostra juntos os campos C3 e D4 no resultado.
    opcao.textContent = [video.classificacao, video.titulo].filter(Boolean).join(" - ");
    menuC3.appendChild(opcao);
  });

  menuC3.disabled = encontrados.length === 0;
  atualizarBotoesNavegacao();
  status.textContent = encontrados.length
    ? `${encontrados.length} resultado(s). Selecione um conteúdo para reproduzir.`
    : (termo ? "Nenhum conteúdo corresponde à pesquisa." : "Digite o nome de um canal ou conteúdo.");
}

function criarPlayer(){
  if(!videos.length)return;
  const item=videos[selecionado];if(!item)return;
  limparTemporizadorPlayerExterno();
  const area=document.getElementById("player"),geracao=++geracaoPlayer;
  if(ytPlayerApi){try{ytPlayerApi.destroy();}catch(e){}ytPlayerApi=null;}
  if(hlsInstance){try{hlsInstance.destroy();}catch(e){}hlsInstance=null;}
  area.replaceChildren();player=null;
  //adicionei
  // Resolve o canal do YouTube e procura sua transmissão ao vivo.
if(item.tipo==="youtube-channel"){

  status.textContent="Localizando transmissão ao vivo: "+item.titulo;

  resolverTransmissaoAoVivo(item)
    .then(videoId=>{

      if(geracao!==geracaoPlayer)return;

      item.id=videoId;
      item.tipo="youtube";

      criarPlayer();

    })
    .catch(erro=>{

      if(geracao!==geracaoPlayer)return;

      status.textContent="Não foi possível abrir "+item.titulo+": "+erro.message;

      console.error("Erro ao localizar transmissão:",erro);

    });

  return;
}
    // PLAYLIST M3U EXTERNA: CNN PORTUGAL
  // Lê o arquivo do GitHub e extrai a URL HLS atualizada.

  //if(item.tipo==="m3u-ref"){
    if(item.tipo==="m3u-ref"){

    const urlArquivo = item.urlM3uRef || item.url;

    status.textContent="Buscando endereço atualizado da CNN Portugal...";

    fetch(urlArquivo+"?v="+Date.now(),{
      cache:"no-store"
    })
    .then(resposta=>{
      if(!resposta.ok){
        throw new Error("HTTP "+resposta.status);
      }
      return resposta.text();
    })
    .then(texto=>{

      if(geracao!==geracaoPlayer)return;

      const enderecoHLS=texto
        .replace(/^\uFEFF/,"")
        .split(/\r?\n/)
        .map(linha=>linha.trim())
        .filter(linha=>linha && !linha.startsWith("#"))
        .find(linha=>/^https:\/\/video-auth1\.iol\.pt\//i.test(linha));

      if(!enderecoHLS){
        throw new Error("Não encontrei a URL HLS da CNN no arquivo M3U.");
      }

      const urlValidada=new URL(enderecoHLS);

      if(urlValidada.searchParams.get("wmsAuthSign")===null ||
         !urlValidada.searchParams.get("wmsAuthSign")){
        throw new Error("O arquivo M3U não contém um token de autenticação.");
      }

      item.urlM3uRef=urlArquivo;
      item.url=urlValidada.toString();
      item.tipo="hls";

      console.log("URL HLS da CNN Portugal encontrada.");

      criarPlayer();

    })
    .catch(erro=>{

      if(geracao!==geracaoPlayer)return;

      console.error("Erro ao carregar playlist da CNN:",erro);

      status.textContent="Erro ao buscar CNN Portugal: "+erro.message;

    });

    return;
  }
  // PLAYER EXTERNO UNIFICADO
  // Twitch, Restream, NPHd, EmbedTV, RDCanais,
  // RedeCanais e demais páginas externas.

  if(
    item.tipo==="twitch" ||
    item.tipo==="restream" ||
    item.tipo==="frame" ||
    item.tipo==="iframe"
  ){

    let url = String(item.url || "")
      .trim()
      .replace(/\\&/g,"&");

    const urlOriginal = url;

    try{

      const endereco = new URL(url);

      // Configuração especial da Twitch.
      if(item.tipo==="twitch"){

        const canal = endereco.searchParams.get("channel");

        if(!canal){
          throw new Error("O endereço da Twitch não contém o nome do canal.");
        }

        const twitchUrl = new URL("https://player.twitch.tv/");

        twitchUrl.searchParams.set("channel",canal);
        twitchUrl.searchParams.set("parent",location.hostname);
        twitchUrl.searchParams.set("autoplay","true");
        twitchUrl.searchParams.set("muted","false");
        twitchUrl.searchParams.set("controls","true");

        url = twitchUrl.toString();

      }

      // Configuração especial do EmbedTV.
      // O marcador de liberação continua sendo verificado
      // na URL original da playlist, não nesta URL modificada.
      else if(
        endereco.hostname === "embedtv.cc" ||
        endereco.hostname.endsWith(".embedtv.cc")
      ){

        endereco.searchParams.set("autoplay","1");
        url = endereco.toString();

      }

      // Restream e os demais players usam o endereço original.
      else{

        url = endereco.toString();

      }

    }catch(erro){

      status.textContent =
        "Endereço externo inválido: " + erro.message;

      console.error("Erro no player externo:",erro);

      return;
    }

    criarIframeExterno(
      item,
      geracao,
      url,
      urlOriginal
    );

    return;
  }


  // Fluxos de rádio/áudio diretos (por exemplo, URLs /stream sem extensão).
  if(item.tipo==="audio"){
    const audioEl=document.createElement("audio");
    audioEl.title=item.titulo;
    audioEl.controls=true;
    audioEl.autoplay=true;
    audioEl.preload="none";
    audioEl.style.cssText="display:block;width:100%;max-width:900px;margin:auto;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);";
    area.appendChild(audioEl);
    player=audioEl;
    audioEl.addEventListener("playing",()=>{status.textContent="Reproduzindo rádio: "+item.titulo;});
    audioEl.addEventListener("error",()=>{
      const e=audioEl.error;
      console.error("Erro no áudio:",{code:e?.code,message:e?.message,url:item.url});
      status.textContent="Não foi possível reproduzir esta rádio neste navegador. Verifique o formato do fluxo ou CORS.";
    });
    audioEl.src=item.url;
    audioEl.play().catch(()=>{status.textContent="Rádio carregada. Pressione Play para iniciar.";});
    return;
  }

  if(item.tipo==="hls"||/\.m3u8(?:$|[?#])/i.test(item.url)){
    const videoEl=document.createElement("video");
    videoEl.title=item.titulo;
    videoEl.controls=false;
    videoEl.autoplay=true;
    videoEl.playsInline=true;
    videoEl.preload="auto";
    videoEl.tabIndex=0;
    videoEl.setAttribute("playsinline","");
    videoEl.setAttribute("webkit-playsinline","");
    // Controles próprios: evita o símbolo de pausa nativo preso na tela.
videoEl.addEventListener("click",()=>{
  if(videoEl.paused){
    videoEl.play().catch(e=>console.warn("Não foi possível iniciar:",e));
  }else{
    videoEl.pause();
  }
});

videoEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){
    e.preventDefault();
    if(videoEl.paused){
      videoEl.play().catch(err=>console.warn(err));
    }else{
      videoEl.pause();
    }
  }
});
    videoEl.style.cssText="display:block;width:100%;height:100%;object-fit:contain;background:#000;";

    area.appendChild(videoEl);
    player=videoEl;

    videoEl.addEventListener("playing",()=>{
      if(geracao===geracaoPlayer)status.textContent="Reproduzindo transmissão: "+item.titulo;
    });
    videoEl.addEventListener("waiting",()=>{
      if(geracao===geracaoPlayer)status.textContent="Aguardando dados da transmissão…";
    });
    videoEl.addEventListener("stalled",()=>{
      if(geracao===geracaoPlayer)status.textContent="Conexão instável. Aguardando transmissão…";
    });
    videoEl.addEventListener("error",()=>{
      if(geracao!==geracaoPlayer)return;
      const e=videoEl.error;
      console.error("Erro do elemento de vídeo:",{code:e?.code,message:e?.message,url:item.url});
      if(e)status.textContent="O navegador não conseguiu decodificar o vídeo (código "+e.code+").";
    });

    // HLS.js para navegadores sem HLS nativo.
    if(window.Hls&&Hls.isSupported()){
      const hls=new Hls({
        enableWorker:true,
        lowLatencyMode:false,
        backBufferLength:60,
        maxBufferLength:30,
        maxMaxBufferLength:60,
        manifestLoadingTimeOut:20000,
        manifestLoadingMaxRetry:4,
        manifestLoadingRetryDelay:1000,
        manifestLoadingMaxRetryTimeout:10000,
        levelLoadingTimeOut:20000,
        levelLoadingMaxRetry:4,
        levelLoadingRetryDelay:1000,
        fragLoadingTimeOut:30000,
        fragLoadingMaxRetry:6,
        fragLoadingRetryDelay:1000,
        fragLoadingMaxRetryTimeout:12000,
        startFragPrefetch:true
      });
      hlsInstance=hls;
      let recuperacoesRede=0;
      let recuperacoesMidia=0;
      let encerrado=false;

      hls.on(Hls.Events.MANIFEST_PARSED,()=>{
        if(geracao!==geracaoPlayer)return;
        status.textContent="Lista HLS carregada. Iniciando transmissão…";
        videoEl.play().catch(erro=>{
          console.warn("Reprodução automática bloqueada:",erro);
          status.textContent="Transmissão carregada. Pressione Play nos controles do vídeo.";
        });
      });

      hls.on(Hls.Events.ERROR,(_event,data)=>{
        if(geracao!==geracaoPlayer||encerrado)return;
        console.error("Diagnóstico HLS:",{
          tipo:data.type,
          detalhe:data.details,
          fatal:data.fatal,
          statusHTTP:data.response?.code,
          url:data.response?.url,
          erro:data.error
        });
        if(!data.fatal)return;

        registrarFalha(item,"M3U8/HLS",data.details||data.error?.message||"Erro HLS fatal",data.response?.code||data.details||"");

        if(data.type===Hls.ErrorTypes.NETWORK_ERROR&&recuperacoesRede<3){
          recuperacoesRede++;
          status.textContent="Falha temporária de rede. Tentando reconectar ("+recuperacoesRede+"/3)…";
          setTimeout(()=>{
            if(geracao===geracaoPlayer&&hlsInstance===hls)hls.startLoad();
          },1500*recuperacoesRede);
          return;
        }
        if(data.type===Hls.ErrorTypes.MEDIA_ERROR&&recuperacoesMidia<2){
          recuperacoesMidia++;
          status.textContent="Recuperando o decodificador de vídeo…";
          hls.recoverMediaError();
          return;
        }

        encerrado=true;
        status.textContent="Não foi possível reproduzir este M3U8 neste navegador. Consulte o diagnóstico no console (F12).";
        try{hls.destroy();}catch(e){}
        if(hlsInstance===hls)hlsInstance=null;
      });

      hls.loadSource(item.url);
      hls.attachMedia(videoEl);
    }else if(videoEl.canPlayType("application/vnd.apple.mpegurl")||videoEl.canPlayType("application/x-mpegURL")){
      // Safari e dispositivos com suporte HLS nativo.
      videoEl.src=item.url;
      videoEl.play().catch(erro=>{
        console.warn("Autoplay HLS nativo bloqueado:",erro);
        status.textContent="Transmissão carregada. Pressione Play nos controles do vídeo.";
      });
    }else{
      status.textContent="Este navegador não oferece suporte à reprodução HLS.";
    }
    return;
  }

  const container=document.createElement("div");container.id="youtube-player-container-"+geracao;
  container.style.cssText="width:100%;height:100%;background:#000;";area.appendChild(container);
  status.textContent="Carregando player do YouTube…";
  carregarYouTubeAPI().then(()=>{
    if(geracao!==geracaoPlayer||!area.contains(container))return;
    ytPlayerApi=new YT.Player(container.id,{
      width:"100%",height:"100%",videoId:item.id,
      playerVars:{
        autoplay:1,
        playsinline:1,
        rel:0,
        enablejsapi:1,
        origin:location.origin,
        // Não carregar legendas automaticamente
        cc_load_policy:0,
        // Evita selecionar uma faixa de legenda automaticamente
        cc_lang_pref:""
      },
      events:{
        onReady:event=>{
          status.textContent="Player do YouTube carregado.";
          // Tenta desativar completamente o módulo de legendas
          try{
            event.target.unloadModule("captions");
          }catch(e){}
      // Repete a tentativa após o YouTube terminar de inicializar
    setTimeout(()=>{
      try{
        event.target.unloadModule("captions");
      }catch(e){}
    },500);
  setTimeout(()=>{
    try{
      event.target.unloadModule("captions");
    }catch(e){}
  },1500);
  event.target.playVideo();
},
        onStateChange:event=>{
          if(event.data===YT.PlayerState.PLAYING){
            status.textContent="Reproduzindo: "+item.titulo;

            // Reforça a desativação das legendas depois
            // que o vídeo realmente começou.
            try{
              event.target.unloadModule("captions");
            }catch(e){}

            setTimeout(()=>{
              try{
                event.target.unloadModule("captions");
              }catch(e){}
            },300);
          }

          // Avança apenas quando termina um vídeo gravado do YouTube.
          // A função ignora transmissões ao vivo e outros tipos de conteúdo.
          if(event.data===YT.PlayerState.ENDED){
            avancarParaProximoGravado(item,geracao);
          }
        },
        onError:event=>{
          const mensagens={2:"Parâmetro ou ID de vídeo inválido",5:"Erro no player HTML5 do YouTube",100:"Vídeo removido, privado ou não encontrado",101:"Vídeo não permite reprodução incorporada",150:"Vídeo não permite reprodução incorporada",153:"Erro de identificação do player ou Referer"};
          status.textContent="Falha no canal: "+item.titulo+". Código "+event.data;
          registrarFalha(item,"YouTube",mensagens[event.data]||"Erro informado pelo player do YouTube",event.data);
        }
      }
    });
    player=ytPlayerApi;
  }).catch(erro=>{
    if(geracao!==geracaoPlayer)return;
    status.textContent="Não foi possível carregar o player do YouTube.";
    registrarFalha(item,"YouTube",erro.message||"Falha ao carregar a API do YouTube","API");
  });
}

async function carregarLista(){
  try{
    const resposta=await fetch("./youtube.txt?v="+Date.now(),{cache:"no-store"});
    if(!resposta.ok)throw new Error("HTTP "+resposta.status);
    const texto=await resposta.text();
    todosVideos=texto.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith("#")).map((linha,indice)=>{
      const partes=linha.split("|").map(p=>p.trim());
      let tema,categoria,classificacao,titulo,url;
      if(partes.length>=5){[tema,categoria,classificacao,titulo]=partes;url=partes.slice(4).join("|").trim();}
      else if(partes.length>=3){
        const temaAntigo=partes[0]||"Geral";titulo=partes[1]||"Vídeo "+(indice+1);url=partes.slice(2).join("|").trim();
        tema=/bíblic|preg|igreja|relig|estudo/i.test(temaAntigo+" "+titulo)?"religioso":"normal";
        categoria=/live|ao vivo|rádio|radio|notícia|cnn|jovem pan|record news|sbt news/i.test(titulo+" "+url)?"live":"filmes";
        classificacao=temaAntigo;
      }else if(partes.length===2){titulo=partes[0]||"Vídeo "+(indice+1);url=partes[1];tema="normal";categoria="filmes";classificacao="Geral";}
      else{titulo="Vídeo "+(indice+1);url=partes[0];tema="normal";categoria="filmes";classificacao="Geral";}
      tema=tema||"Normal";categoria=categoria||"Filmes";classificacao=classificacao||"Geral";titulo=titulo||"Vídeo "+(indice+1);
      const id=extrairId(url);
      let tipo="desconhecido";
      if(
  /raw\.githubusercontent\.com\/edifesf1\/r\/main\/cnn_portugal\.m3u8(?:$|[?#])/i.test(url)
){
  tipo="m3u-ref";
}
else if(/\.m3u8(?:$|[?#])/i.test(url)){
  tipo="hls";
}
      else if(id)tipo="youtube";
      else if(/^https?:\/\/player\.twitch\.tv\//i.test(url))tipo="twitch";
      else if(/^https?:\/\/player\.restream\.io\//i.test(url))tipo="restream";
        //adicionei linha abaixo
      else if(extrairHandleCanal(url))tipo="youtube-channel";
        
      else if(/^https?:\/\/(?:www\.)?nphd\.online\//i.test(url) ||
              /^https?:\/\/(?:[a-z0-9-]+\.)?embedtv\.cc\//i.test(url))tipo="frame";
      // Mantém fluxos diretos de áudio; qualquer outra página HTTP/HTTPS
      // é tratada como player externo em iframe, com interação liberada.
      else if(/^https?:\/\//i.test(url) &&
              (/(?:\.mp3|\.aac|\.m4a|\.ogg|\.opus|\.wav|\.flac|\.m3u|\.pls)(?:$|[?#])/i.test(url) ||
               /\/stream(?:\/|$|[?#])/i.test(new URL(url).pathname+new URL(url).search)))tipo="audio";
      else if(/^https?:\/\//i.test(url))tipo="iframe";

      if(tipo==="youtube-channel"){
  return {
    tema,categoria,classificacao,titulo,
    id:null,url,tipo,
    handle:extrairHandleCanal(url)
  };
}

if(tipo==="m3u-ref"||tipo==="hls"||tipo==="audio"||tipo==="restream"||tipo==="twitch"||tipo==="frame"||tipo==="iframe")
  return{tema,categoria,classificacao,titulo,id:null,url,tipo};
      return id?{tema,categoria,classificacao,titulo,id,url,tipo}:null;

      
    }).filter(Boolean);
    // "Pesquisa" fica sempre como primeira opção; os temas vêm depois em ordem alfabética.
    const temas = [...new Set(todosVideos.map(v => v.tema).filter(Boolean))]
      .filter(tema => tema !== "Pesquisa")
      .sort((a, b) => a.localeCompare(b, "pt-BR"));
    menuA1.replaceChildren();
    const opcaoPesquisa = document.createElement("option");
    opcaoPesquisa.value = "Pesquisa";
    opcaoPesquisa.textContent = "Pesquisa";
    menuA1.appendChild(opcaoPesquisa);
    temas.forEach(tema => {
      const opcao = document.createElement("option");
      opcao.value = tema;
      opcao.textContent = tema;
      menuA1.appendChild(opcao);
    });
    menuA1.value = "";
    limparAbaixo(1);
    aplicarFiltros();
  }catch(erro){console.error(erro);status.textContent="Erro ao ler youtube.txt. Verifique se o arquivo está publicado no GitHub Pages.";}
}

carregarLogins();
carregarLista();
