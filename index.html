<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youtube IPTV</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column}

/* ===== TARJA ===== */
header{
  position:relative;z-index:1000;flex:0 0 auto;width:100%;
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  min-height:58px;background:#c00;transition:all 0.3s
}
#cascadeBar{display:flex;align-items:center;gap:7px;flex:1 1 auto;min-width:0;overflow-x:auto}
.cascade-group{display:flex;flex:1 1 0;min-width:0}
.cascade-group label{display:none}
.cascade-group select{
  width:100%;min-width:0;max-width:240px;padding:9px 22px 9px 8px;
  border:1px solid rgba(255,255,255,.5);border-radius:5px;
  background:#a90000;color:#fff;font-size:14px;outline:none
}
.cascade-group select:focus{border-color:#fff;outline:3px solid #ff0}
.cascade-group[hidden]{display:none}
#navegacaoCanais{display:flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto}
#navegacaoCanais button{
  width:38px;height:38px;border:1px solid rgba(255,255,255,.65);border-radius:6px;
  background:#990000;color:#fff;font-size:22px;cursor:pointer
}
#botaoTarja{
  width:38px;height:38px;border:1px solid rgba(255,255,255,.7);border-radius:6px;
  background:#790000;color:#fff;font-size:20px;cursor:pointer
}

/* ===== MODO MOUSE — GARANTIDO ===== */
#camadaMouse{
  position:fixed;inset:0;z-index:99999;display:none;background:rgba(0,0,0,.01)
}
body.modo-mouse #camadaMouse{display:block}

#ponteiro{
  position:fixed;top:50%;left:50%;width:32px;height:32px;
  margin:-16px 0 0 -16px;pointer-events:none;z-index:100000;
  background:#fff;border:3px solid #c00;border-radius:50%;
  box-shadow:0 0 15px rgba(255,255,255,.9);
  transition:none
}
#avisoMouse{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:#c00;color:#fff;padding:10px 25px;border-radius:30px;
  font-size:16px;font-weight:bold;z-index:100001
}

/* Tarja recolhida */
body.tarja-recolhida>header{position:fixed;top:0;left:0;right:0;height:0;min-height:0;padding:0;background:transparent;pointer-events:none}
body.tarja-recolhida>header>#cascadeBar,
body.tarja-recolhida>header>#navegacaoCanais{display:none}
body.tarja-recolhida>header>#botaoTarja{position:fixed;top:8px;right:8px;pointer-events:auto}
body.tarja-recolhida>main{position:fixed;inset:0}

/* Tela de login e resto */
main{position:relative;flex:1 1 auto;width:100%;overflow:hidden}
#player{position:absolute;inset:0;width:100%;height:100%}
#player iframe,#player video{width:100%!important;height:100%!important;border:0}
body.bloqueado{overflow:hidden}
body.bloqueado>header,body.bloqueado>main{visibility:hidden}
#telaLogin{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#111}
#caixaLogin{padding:30px;border-radius:16px;background:#222;text-align:center}
#campoLogin{padding:14px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;font-size:18px;text-align:center}
#entrarLogin{padding:14px;border:0;border-radius:8px;background:#c00;color:#fff;font-weight:bold;cursor:pointer}
#erroLogin{color:#f77;margin-top:10px}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>
</head>
<body class="bloqueado">

<!-- ===== CAMADA DO MOUSE — SEMPRE POR CIMA DE TUDO ===== -->
<div id="camadaMouse">
  <div id="ponteiro"></div>
  <div id="avisoMouse">🖱️ MOUSE ATIVO ⬆️=SAIR ⬅️➡️⬇️=MOVER OK=CLICAR</div>
</div>

<section id="telaLogin">
  <div id="caixaLogin">
    <h1>Youtube IPTV</h1>
    <p>Digite seu login de acesso</p>
    <input id="campoLogin" autocomplete="off" maxlength="6" placeholder="Ex: A7B29X">
    <button id="entrarLogin">ENTRAR</button>
    <div id="erroLogin"></div>
  </div>
</section>

<header>
  <nav id="cascadeBar">
    <div class="cascade-group" id="grupoA1"><select id="menuA1"><option value=""></option></select></div>
    <div class="cascade-group" id="grupoB2" hidden><select id="menuB2"><option value=""></option></select></div>
    <div class="cascade-group" id="grupoC3" hidden><select id="menuC3"><option value=""></option></select></div>
    <div class="cascade-group" id="grupoD4" hidden><select id="menuD4"><option value=""></option></select></div>
    <input id="campoPesquisa" type="search" placeholder="Pesquisar..." style="display:none;padding:8px;border-radius:5px;background:#a90000;color:#fff;border:1px solid #fff">
  </nav>
  <div id="navegacaoCanais">
    <button id="canalAnterior">◀</button>
    <button id="proximoCanal">▶</button>
  </div>
  <button id="botaoTarja" title="Recolher/Mostrar">▁</button>
</header>

<main>
  <div id="player"></div>
  <div id="status" style="position:fixed;bottom:5px;left:5px;background:rgba(0,0,0,.7);padding:5px 10px;font-size:13px;z-index:500">Carregando...</div>
</main>

<script>
// =====================================================
// 🖱️ SISTEMA DE MOUSE — SIMPLES E GARANTIDO
// =====================================================
const camadaMouse = document.getElementById('camadaMouse');
const ponteiro = document.getElementById('ponteiro');
const VELOCIDADE = 12; // Ajuste aqui: menor = mais devagar

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let modoMouseLigado = false;

function atualizarPonteiro(){
  ponteiro.style.left = mouseX + 'px';
  ponteiro.style.top = mouseY + 'px';
}

function ligarMouse(){
  if(modoMouseLigado) return;
  modoMouseLigado = true;
  document.body.classList.add('modo-mouse');
  mouseX = window.innerWidth / 2;
  mouseY = window.innerHeight / 2;
  atualizarPonteiro();
  console.log('✅ MODO MOUSE LIGADO!');
}

function desligarMouse(){
  if(!modoMouseLigado) return;
  modoMouseLigado = false;
  document.body.classList.remove('modo-mouse');
  console.log('❌ MODO MOUSE DESLIGADO');
}

function clicarAqui(){
  // Dispara clique REAL na posição do ponteiro
  const el = document.elementFromPoint(mouseX, mouseY);
  if(el && !['camadaMouse','ponteiro'].includes(el.id)){
    el.click();
    console.log('👆 Clicou em:', el);
  }
}

// TECLADO — O CORAÇÃO DO SISTEMA
document.addEventListener('keydown', function(e){
  console.log('Tecla pressionada:', e.key, 'Modo mouse:', modoMouseLigado);

  if(modoMouseLigado){
    e.preventDefault();
    switch(e.key){
      case 'ArrowLeft':  mouseX = Math.max(20, mouseX - VELOCIDADE); break;
      case 'ArrowRight': mouseX = Math.min(window.innerWidth - 20, mouseX + VELOCIDADE); break;
      case 'ArrowDown':  mouseY = Math.min(window.innerHeight - 20, mouseY + VELOCIDADE); break;
      case 'ArrowUp':    mouseY = Math.max(20, mouseY - VELOCIDADE); desligarMouse(); return;
      case 'Enter': case 'OK': clicarAqui(); break;
    }
    atualizarPonteiro();
  }else{
    // Fora do modo mouse: APENAS seta para baixo LIGA o mouse
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      ligarMouse();
    }
  }
});

// =====================================================
// RESTO DO SISTEMA
// =====================================================
const botaoTarja = document.getElementById('botaoTarja');
const menuA1 = document.getElementById('menuA1');
const menuB2 = document.getElementById('menuB2');
const menuC3 = document.getElementById('menuC3');
const menuD4 = document.getElementById('menuD4');
const campoPesquisa = document.getElementById('campoPesquisa');
const status = document.getElementById('status');
const grupos = {
  A1: document.getElementById('grupoA1'),
  B2: document.getElementById('grupoB2'),
  C3: document.getElementById('grupoC3'),
  D4: document.getElementById('grupoD4')
};
let todosVideos = [], videos = [], selecionado = 0;
let ytPlayerApi = null, hlsInstance = null, geracaoPlayer = 0;
const URL_SESSOES = "https://script.google.com/macros/s/AKfycbyjEMCft9Z-84Owpfukv4ROvVv3w2Ax4QsyPvULPuk424Ej8Liz8AU5xmQnoLSDMl2b/exec";
const DEVICE_KEY = "edifesfDeviceId";
let LOGINS_VALIDOS = [];

botaoTarja.addEventListener('click', () => {
  const rec = document.body.classList.toggle('tarja-recolhida');
  botaoTarja.textContent = rec ? '☰' : '▁';
});

function obterDeviceId(){
  let id = localStorage.getItem(DEVICE_KEY);
  if(!id){ id = 'dev_' + Math.random().toString(36).slice(2); localStorage.setItem(DEVICE_KEY, id); }
  return id;
}

async function carregarLogins(){
  try{
    const r = await fetch('./LOGINS-200.txt?v='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(''+r.status);
    LOGINS_VALIDOS = [...new Set((await r.text()).split(/\r?\n/).map(l=>l.trim().toUpperCase()).filter(l=>/^[A-Z0-9]{6}$/.test(l)))];
    const salvo = localStorage.getItem('youtubeIptvLogin');
    if(salvo && LOGINS_VALIDOS.includes(salvo)) await liberarAcesso(salvo);
    else document.getElementById('telaLogin').style.display = 'flex';
  }catch(e){ status.textContent = 'Erro LOGINS-200.txt'; }
}

async function chamarControleSessao(a, l){
  return new Promise((res, rej)=>{
    const cb = 'cb'+Date.now();
    const s = document.createElement('script');
    const t = setTimeout(()=>{delete window[cb];s.remove();rej('timeout');},12000);
    window[cb] = d => {clearTimeout(t);delete window[cb];s.remove();res(d);};
    s.src = URL_SESSOES + '?'+new URLSearchParams({action:a,login:l,device:obterDeviceId(),callback:cb});
    document.head.appendChild(s);
  });
}

async function liberarAcesso(login){
  try{
    const r = await chamarControleSessao('claim', login);
    if(!r.ok) throw new Error(r.message);
    localStorage.setItem('youtubeIptvLogin', login);
    document.body.classList.remove('bloqueado');
    document.getElementById('telaLogin').style.display = 'none';
    setInterval(()=>chamarControleSessao('heartbeat', login).catch(()=>{}),30000);
    carregarLista();
    return true;
  }catch(e){
    document.getElementById('erroLogin').textContent = e.message;
    return false;
  }
}

document.getElementById('caixaLogin').addEventListener('submit', async e=>{
  e.preventDefault();
  const l = document.getElementById('campoLogin').value.trim().toUpperCase();
  if(!LOGINS_VALIDOS.includes(l)){
    document.getElementById('erroLogin').textContent = 'Login inválido';
    return;
  }
  await liberarAcesso(l);
});

function extrairId(u){
  try{
    const url = new URL(u);
    if(url.hostname==='youtu.be') return url.pathname.slice(1).split('/')[0];
    if(['youtube.com','www.youtube.com'].includes(url.hostname) && url.pathname==='/watch') return url.searchParams.get('v');
    const p = url.pathname.split('/').filter(Boolean);
    if(['embed','shorts','live'].includes(p[0])) return p[1];
  }catch{}
  return null;
}

async function carregarYouTubeAPI(){
  if(window.YT?.Player) return;
  await new Promise((res, rej)=>{
    const t = setTimeout(()=>rej('timeout'),15000);
    window.onYouTubeIframeAPIReady = () => {clearTimeout(t);res();};
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
}

function criarPlayer(){
  if(!videos.length) return;
  const item = videos[selecionado];
  const area = document.getElementById('player');
  geracaoPlayer++;
  if(ytPlayerApi){try{ytPlayerApi.destroy();}catch{}}
  if(hlsInstance){try{hlsInstance.destroy();}catch{}}
  area.innerHTML = '';

  if(item.url.match(/\.m3u8/i)){
    const v = document.createElement('video');
    v.controls = v.autoplay = v.playsInline = true;
    v.style.cssText = 'width:100%;height:100%';
    area.appendChild(v);
    if(Hls?.isSupported()){
      hlsInstance = new Hls();
      hlsInstance.loadSource(item.url);
      hlsInstance.attachMedia(v);
    }else v.src = item.url;
    status.textContent = '▶️ '+item.titulo+' | ⬇️=MODO MOUSE';
    return;
  }

  const c = document.createElement('div');
  c.id = 'yt'+geracaoPlayer;
  area.appendChild(c);
  carregarYouTubeAPI().then(()=>{
    ytPlayerApi = new YT.Player(c.id, {
      videoId: item.id,
      playerVars: {autoplay:1,playsinline:1,rel:0},
      events: {
        onReady: ()=>{status.textContent = '✅ '+item.titulo+' | ⬇️=MODO MOUSE';},
        onError: (e)=>{status.textContent = 'Erro: '+e.data;}
      }
    });
  });
}

function preencher(sel, vals){
  sel.innerHTML = '<option value=""></option>' + [...new Set(vals)].sort().map(v=>`<option>${v}</option>`).join('');
}

menuA1.addEventListener('change', ()=>{
  [menuB2,menuC3,menuD4].forEach(m=>m.value='');
  grupos.B2.hidden = grupos.C3.hidden = grupos.D4.hidden = true;
  campoPesquisa.style.display = 'none';
  if(menuA1.value === 'Pesquisa'){
    campoPesquisa.style.display = 'block';
    grupos.B2.hidden = false;
    menuB2.style.display = 'none';
    return;
  }
  if(menuA1.value){
    preencher(menuB2, todosVideos.filter(v=>v.tema===menuA1.value).map(v=>v.categoria));
    grupos.B2.hidden = false;
  }
  aplicar();
});

menuB2.addEventListener('change', ()=>{
  [menuC3,menuD4].forEach(m=>m.value='');
  grupos.C3.hidden = grupos.D4.hidden = true;
  if(menuA1.value && menuB2.value){
    preencher(menuC3, todosVideos.filter(v=>v.tema===menuA1.value&&v.categoria===menuB2.value).map(v=>v.classificacao));
    grupos.C3.hidden = false;
  }
  aplicar();
});

menuC3.addEventListener('change', ()=>{
  menuD4.value=''; grupos.D4.hidden = true;
  if(menuA1.value && menuB2.value && menuC3.value){
    preencher(menuD4, todosVideos.filter(v=>v.tema===menuA1.value&&v.categoria===menuB2.value&&v.classificacao===menuC3.value).map(v=>v.titulo));
    grupos.D4.hidden = false;
  }
  aplicar();
});

menuD4.addEventListener('change', aplicar);
campoPesquisa.addEventListener('input', ()=>{
  const t = campoPesquisa.value.trim().toLowerCase();
  videos = t ? todosVideos.filter(v=> (v.titulo+v.classificacao).toLowerCase().includes(t)) : [];
  selecionado = 0;
  status.textContent = videos.length ? videos.length+' encontrados' : 'Nenhum resultado';
  if(videos.length) criarPlayer();
});

function aplicar(){
  videos = todosVideos.filter(v=>
    (!menuA1.value||v.tema===menuA1.value) &&
    (!menuB2.value||v.categoria===menuB2.value) &&
    (!menuC3.value||v.classificacao===menuC3.value)
  );
  selecionado = 0;
  if(videos.length) criarPlayer();
  status.textContent = videos.length+' vídeos | ⬇️=MODO MOUSE';
}

document.getElementById('canalAnterior').onclick = ()=>{selecionado=(selecionado-1+videos.length)%videos.length;criarPlayer();};
document.getElementById('proximoCanal').onclick = ()=>{selecionado=(selecionado+1)%videos.length;criarPlayer();};

async function carregarLista(){
  try{
    const r = await fetch('./youtube.txt?v='+Date.now(), {cache:'no-store'});
    const t = await r.text();
    todosVideos = t.split(/\r?\n/).map(l=>l.trim()).filter(l&&!l.startsWith('#')).map(l=>{
      const p = l.split('|').map(x=>x.trim());
      let tema,categoria,titulo,url;
      if(p.length>=5)[tema,categoria,,titulo,url]=p;
      else if(p.length>=3)[tema,titulo,url]=p;
      else if(p.length==2)[titulo,url]=p;
      else return null;
      return {tema:tema||'Geral', categoria:categoria||'Padrão', classificacao:'', titulo:titulo||'Vídeo', url, id:extrairId(url)};
    }).filter(v=>v && (v.id || v.url.includes('.m3u8')));

    const temas = ['Pesquisa', ...[...new Set(todosVideos.map(v=>v.tema))].filter(t=>t!=='Pesquisa').sort()];
    menuA1.innerHTML = temas.map(t=>`<option>${t}</option>`).join('');
    aplicar();
  }catch(e){ status.textContent = 'Erro ao carregar lista'; }
}

carregarLogins();
</script>
</body>
</html>
