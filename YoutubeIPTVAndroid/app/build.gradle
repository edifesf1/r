plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edifesf1.youtubeiptv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edifesf1.youtubeiptv'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}


// Define o nome do arquivo APK gerado.
android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "Edifesf.apk"
    }
}
